<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeaseDesk social preview</title>
    <!-- 1280 x 640, rendered at 2x and downscaled to docs/media/social.png -->
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        width: 1280px;
        height: 640px;
        position: relative;
      }
      #art {
        position: absolute;
        inset: 0;
      }
      .title {
        position: absolute;
        left: 92px;
        top: 128px;
        width: 560px;
      }
      .mark {
        display: flex;
        align-items: flex-start;
        gap: 22px;
      }
      .wordmark {
        font-size: 172px;
        letter-spacing: 1px;
        margin-top: -8px;
      }
      .rule {
        margin: 8px 0 24px 4px;
        width: 420px;
        height: 18px;
      }
      .caption {
        font-size: 33px;
        line-height: 1.3;
        width: 540px;
        margin-left: 4px;
      }
      .line {
        margin: 26px 0 0 4px;
        font-size: 24px;
        line-height: 1.4;
        width: 520px;
        color: var(--ai);
      }
    </style>
  </head>
  <body>
    <svg id="art" width="1280" height="640" viewBox="0 0 1280 640"></svg>
    <div class="title">
      <div class="mark">
        <div class="wordmark">LeaseDesk</div>
        <svg width="76" height="76" viewBox="0 0 76 76" id="seal"></svg>
      </div>
      <svg class="rule" viewBox="0 0 420 18" id="rule"></svg>
      <div class="caption">
        Just-in-time AWS access, asked for in a Switch room and ended by AWS itself
      </div>
      <div class="line">AI drafts and critiques. A person approves. AWS ends the lease on time.</div>
    </div>
    <script src="art.js"></script>
    <script>
      const W = 1280;
      const H = 640;
      const svg = document.getElementById("art");
      const defs = E(svg, "defs");
      const clip = E(defs, "clipPath", { id: "inside" });
      E(clip, "path", { d: innerRule({ w: W, h: H, shrink: 1 }) });
      const art = E(svg, "g", { "clip-path": "url(#inside)" });

      sun(art, { cx: 1124, cy: 156, r: 66 });
      kasumi(art, { x: 1016, y: 128, len: 210, h: 15, flip: true });
      kasumi(art, { x: 744, y: 498, len: 250, h: 13 });

      houseWave(E(art, "g", { transform: "translate(22 156) scale(0.97)" }));
      seigaiha(E(art, "g"), {
        x0: 640,
        y0: 540,
        x1: W,
        y1: H,
        r: 22,
        left: (y) => 800 - (y - 540) * 1.9,
      });

      frame(svg, { w: W, h: H });
      seal(document.getElementById("seal"), { x: 4, y: 4, size: 68 });

      const rule = document.getElementById("rule");
      E(rule, "path", {
        d: "M2 9 C66 9 100 2 144 6 C188 10 222 16 266 10 C310 4 364 9 418 9",
        fill: "none",
        stroke: PAL.kin,
        "stroke-width": 1.6,
        "stroke-linecap": "round",
      });
      E(rule, "circle", { cx: 144, cy: 6, r: 2.4, fill: PAL.kin });
    </script>
  </body>
</html>
