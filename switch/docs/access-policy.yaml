# access-policy: the rules keymaster enforces. A PERSON pastes this into a Gateway library
# document named "access-policy"; it reaches the rooms in the leasedesk-governance package.
# keymaster only reads documents that no agent created, so no agent (prompt-injected or not)
# can rewrite these rules.
#
# Fill in the ids: in the Discord room, each person sends "@keymaster whoami" and copies the
# participant id it replies with. Ids embed the Discord bridge id, so they change if Discord is
# disconnected and reconnected; re-run whoami and update this document after a reconnect.
# Then send "@keymaster reload-policy" (keymaster also re-reads it every 5 minutes).
version: 1
solo_mode: true            # true lets a requester approve their own lease (one-person testing)
max_duration_minutes: 240
default_duration_minutes: 60
approval_timeout_minutes: 30
confirm_timeout_minutes: 15
principals:                 # participant id -> IAM user the lease attaches to
  "<REQUESTER_PARTICIPANT_ID>": "lease-demo-dev"
approvers:
  - {id: "<APPROVER_PARTICIPANT_ID>", name: "Priya", groups: [security]}
  - {id: "<REQUESTER_PARTICIPANT_ID>", name: "Arnab", groups: [eng-lead]}
high_risk:
  approvals: 1              # demo value: production uses 2
  require_group: security
  approval_room: security-review
allowed_resource_prefixes:
  - "arn:aws:s3:::leasedesk-demo-"
  - "arn:aws:logs:us-east-1:<ACCOUNT_ID>:log-group:/leasedesk/"
forbidden_actions: ["iam:*", "sts:AssumeRole", "organizations:*", "kms:Decrypt", "secretsmanager:GetSecretValue"]
