[project]
name = "leasedesk"
version = "0.1.0"
description = "Just-in-time cloud access desk in a Switch room"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arnab Singh" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "moto[server]>=5.0",
    "parliament>=1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "setuptools<81",
    "structlog>=24.1",
    "typer>=0.12",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leasedesk"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".state", ".secrets", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC109"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["leasedesk"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "parliament.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["e2e: end-to-end tests against moto (make e2e-mock)"]
